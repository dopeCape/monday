[package]
name = "monday"
version = "0.1.0"
description = "A calm, agent-first email client"
authors = ["monday contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "monday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
base64 = "0.22"
thiserror = "2"
# SQLCipher compiled in, with OpenSSL built from source for the target: the same
# Cache on Linux, macOS, Windows, Android (NDK clang) and iOS (Xcode clang).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
# The pinned fetch (src/pinned.rs): a phone's requests to a LAN Server whose
# self-signed certificate it pinned at pairing. rustls on ring builds for every
# target without CMake; the certificate check is monday's own.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"

# A computer only (docs/mobile.md): the Local runtime CLIs and the Sidecar spawn
# through the shell plugin, and the config file is watched for outside edits.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"
notify = "8"
notify-debouncer-mini = "0.6"

# The keychain (src/secrets.rs): the OS keychain everywhere but Android, where
# it is SharedPreferences encrypted with a key held in the Android Keystore.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# A phone pairs by scanning the QR code its computer shows (screens/Connect.tsx).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_34"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Debug builds keep monday's own code unoptimised (fast rebuilds, real stack
# traces) but optimise every dependency: unoptimised SQLCipher made each Cache
# write cost several times the CPU while a mailbox synced.
[profile.dev.package."*"]
opt-level = 2
